### model
model_name_or_path: Qwen/Qwen3-VL-30B-A3B-Thinking
image_max_pixels: 401408
video_max_pixels: 401408
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: <FILL_IN_DATASET_NAME>     # e.g. toolcall_3more_ocr_code_0429_optim_level2a

template: qwen3_vl
cutoff_len: 131072
# max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 16

### output
output_dir: saves/<FILL_IN_RUN_NAME>
logging_steps: 1
save_strategy: steps
save_steps: 200            # save every 200 steps
# Best-checkpoint selection (HF Trainer) — at end of training the best ckpt
# (lowest eval_loss) is loaded into the model and preserved on disk regardless
# of save_total_limit. Requires save_steps to be a multiple of eval_steps.
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: <FILL_IN_RUN_NAME>

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-6
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
eval_on_start: true

### early stopping (disabled — set early_stopping_steps to a positive int to enable)
# LLaMA-Factory wraps HF's EarlyStoppingCallback. The "steps" here is the
# *patience in eval rounds* (NOT training steps): stop if eval_loss does not
# improve for N consecutive evaluations, i.e. N * eval_steps training steps.
# Example: early_stopping_steps: 5  ->  stops after 5 * 50 = 250 stale steps.
early_stopping_steps: null
